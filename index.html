<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Мой Екатеринбург — Карта мест</title>

  <!-- Манифест PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- Стили библиотеки Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #f4f6f9; }

    #map { width: 100%; height: 100%; z-index: 1; }

    /* Полное скрытие копирайтов и водяных знаков в углу карты */
    .leaflet-control-attribution {
      display: none !important;
    }

    /* Верхние кнопки управления (Резервная копия) */
    .controls {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:active { background: #f1f5f9; }

    /* Модальное окно (создание и редактирование) */
    .modal {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-content {
      background: #ffffff;
      border-radius: 12px;
      width: 100%;
      max-width: 380px;
      padding: 20px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2);
    }

    .modal-content h3 { margin-bottom: 12px; font-size: 18px; color: #0f172a; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 4px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .btn-primary { background: #2563eb; color: #fff; border: none; }
    .btn-edit { background: #0284c7; color: #fff; border: none; }
    .btn-danger { background: #ef4444; color: #fff; border: none; }

    /* Оформление карточки внутри балуна */
    .popup-card { font-size: 13px; line-height: 1.4; min-width: 180px; }
    .popup-card h4 { font-size: 15px; margin-bottom: 4px; color: #0f172a; }
    .popup-rating { color: #f59e0b; font-weight: bold; margin-bottom: 6px; }
    .popup-comment { margin-bottom: 6px; color: #334155; }
    .popup-actions { margin-top: 10px; display: flex; gap: 6px; }
  </style>
</head>
<body>

  <!-- Контейнер карты -->
  <div id="map"></div>

  <!-- Кнопки экспорта и импорта -->
  <div class="controls">
    <button class="btn" onclick="exportData()"> Экспорт (JSON)</button>
    <button class="btn" onclick="document.getElementById('importFile').click()"> Импорт</button>
    <input type="file" id="importFile" style="display:none" onchange="importData(event)" accept=".json">
  </div>

  <!-- Модальное окно создания / редактирования метки -->
  <div class="modal" id="pointModal">
    <div class="modal-content">
      <h3 id="modalTitle">Новое место</h3>
      <div class="form-group">
        <label>Название / Описание места</label>
        <input type="text" id="placeTitle" placeholder="Например: Любимая кофейня">
      </div>
      <div class="form-group">
        <label>Категория</label>
        <select id="placeCategory">
          <option value="Заведение">☕ Заведение (кафе, бар, ресторан)</option>
          <option value="Достопримечательность"> Достопримечательность / Памятник</option>
          <option value="Парк/Природа"> Парк / Набережная</option>
          <option value="Улица/Район"> Улица / Маршрут</option>
          <option value="Другое"> Другое</option>
        </select>
      </div>
      <div class="form-group">
        <label>Оценка</label>
        <select id="placeRating">
          <option value="5">★★★★★ (5/5 — Отлично)</option>
          <option value="4">★★★★☆ (4/5 — Хорошо)</option>
          <option value="3">★★★☆☆ (3/5 — Нормально)</option>
          <option value="2">★★☆☆☆ (2/5 — Плохо)</option>
          <option value="1">★☆☆☆☆ (1/5 — Ужасно)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Впечатления / Заметка</label>
        <textarea id="placeComment" rows="3" placeholder="Что запомнилось, цены, когда посещал..."></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">Отмена</button>
        <button class="btn btn-primary" onclick="saveCurrentPoint()">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Библиотека Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // -------------------------------------------------------------------------
    // 1. ИНИЦИАЛИЗАЦИЯ КАРТЫ
    // attributionControl: false полностью убирает стандартную строчку копирайтов Leaflet
    // -------------------------------------------------------------------------
    const map = L.map('map', {
      attributionControl: false
    }).setView([56.8389, 60.6057], 13); // Екатеринбург, Площадь 1905 года

    // Подложка карты (CartoDB Voyager - чистая и читаемая схема без спутника)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19
    }).addTo(map);

    // -------------------------------------------------------------------------
    // 2. ХРАНЕНИЕ И СОСТОЯНИЕ
    // -------------------------------------------------------------------------
    let places = JSON.parse(localStorage.getItem('ekb_places') || '[]');
    let markersMap = {};      // Ссылка на маркеры Leaflet по id
    let pendingCoords = null; // Координаты для нового места
    let editingId = null;     // ID редактируемого места (если null — создаем новое)

    // Первоначальная отрисовка сохраненных меток
    places.forEach(renderMarker);

    // -------------------------------------------------------------------------
    // 3. ДОБАВЛЕНИЕ ПО КЛИКУ НА КАРТУ
    // -------------------------------------------------------------------------
    map.on('click', (e) => {
      editingId = null; // Сбрасываем режим редактирования
      pendingCoords = { lat: e.latlng.lat, lng: e.latlng.lng };
      openModal('Новое место', '', 'Заведение', '5', '');
    });

    function openModal(titleText, title, cat, rating, comment) {
      document.getElementById('modalTitle').innerText = titleText;
      document.getElementById('placeTitle').value = title;
      document.getElementById('placeCategory').value = cat;
      document.getElementById('placeRating').value = rating;
      document.getElementById('placeComment').value = comment;
      document.getElementById('pointModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('pointModal').style.display = 'none';
      pendingCoords = null;
      editingId = null;
    }

    // -------------------------------------------------------------------------
    // 4. СОХРАНЕНИЕ (И ДЛЯ СОЗДАНИЯ, И ДЛЯ РЕДАКТИРОВАНИЯ)
    // -------------------------------------------------------------------------
    function saveCurrentPoint() {
      const title = document.getElementById('placeTitle').value.trim();
      if (!title) {
        alert('Пожалуйста, введите название!');
        return;
      }

      const category = document.getElementById('placeCategory').value;
      const rating = document.getElementById('placeRating').value;
      const comment = document.getElementById('placeComment').value.trim();

      if (editingId) {
        // --- РЕЖИМ РЕДАКТИРОВАНИЯ ---
        const place = places.find(p => p.id === editingId);
        if (place) {
          place.title = title;
          place.category = category;
          place.rating = rating;
          place.comment = comment;

          // Обновляем текст в балуне маркера на карте
          if (markersMap[editingId]) {
            markersMap[editingId].setPopupContent(buildPopupHtml(place));
          }
        }
      } else {
        // --- РЕЖИМ СОЗДАНИЯ НОВОЙ МЕТКИ ---
        const newPlace = {
          id: Date.now().toString(),
          title: title,
          category: category,
          rating: rating,
          comment: comment,
          lat: pendingCoords.lat,
          lng: pendingCoords.lng,
          date: new Date().toLocaleDateString('ru-RU')
        };
        places.push(newPlace);
        renderMarker(newPlace);
      }

      saveToStorage();
      closeModal();
    }

    // -------------------------------------------------------------------------
    // 5. ГЕНЕРАЦИЯ СОДЕРЖИМОГО КАРТОЧКИ (БАЛУНА)
    // -------------------------------------------------------------------------
    function buildPopupHtml(place) {
      return `
        <div class="popup-card">
          <h4>${escapeHtml(place.title)}</h4>
          <div class="popup-rating">${'★'.repeat(place.rating)}${'☆'.repeat(5 - place.rating)} (${place.category})</div>
          <div class="popup-comment">${escapeHtml(place.comment || 'Без описания')}</div>
          <small style="color:#64748b;">Добавлено: ${place.date}</small>
          <div class="popup-actions">
            <button class="btn btn-edit" style="padding:4px 8px; font-size:11px;" onclick="startEditPlace('${place.id}')">Редактировать</button>
            <button class="btn btn-danger" style="padding:4px 8px; font-size:11px;" onclick="deletePlace('${place.id}')">Удалить</button>
          </div>
        </div>
      `;
    }

    // Отрисовка маркера на карте
    function renderMarker(place) {
      const marker = L.marker([place.lat, place.lng]).addTo(map);
      marker.bindPopup(buildPopupHtml(place));
      markersMap[place.id] = marker;
    }

    // -------------------------------------------------------------------------
    // 6. ФУНКЦИИ РЕДАКТИРОВАНИЯ И УДАЛЕНИЯ
    // -------------------------------------------------------------------------
    window.startEditPlace = function(id) {
      const place = places.find(p => p.id === id);
      if (!place) return;

      // Закрываем балун и переключаем окно в режим редактирования
      if (markersMap[id]) markersMap[id].closePopup();

      editingId = id;
      openModal('Редактировать место', place.title, place.category, place.rating, place.comment);
    };

    window.deletePlace = function(id) {
      if (!confirm('Удалить эту метку?')) return;

      if (markersMap[id]) {
        map.removeLayer(markersMap[id]);
        delete markersMap[id];
      }

      places = places.filter(p => p.id !== id);
      saveToStorage();
    };

    function saveToStorage() {
      localStorage.setItem('ekb_places', JSON.stringify(places));
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[m]));
    }

    // -------------------------------------------------------------------------
    // 7. РЕЗЕРВНАЯ КОПИЯ (JSON ЭКСПОРТ / ИМПОРТ)
    // -------------------------------------------------------------------------
    function exportData() {
      const blob = new Blob([JSON.stringify(places, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ekb_map_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            Object.values(markersMap).forEach(m => map.removeLayer(m));
            markersMap = {};
            places = imported;
            saveToStorage();
            places.forEach(renderMarker);
            alert('Данные успешно импортированы!');
          }
        } catch (err) {
          alert('Ошибка чтения файла: неверный формат JSON.');
        }
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
