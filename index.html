<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Мой Екатеринбург — Карта мест</title>

  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #f4f6f9; }

    #map { width: 100%; height: 100%; z-index: 1; }

    /* Жесткое скрытие водяных знаков и атрибуций */
    .leaflet-control-container .leaflet-bottom.leaflet-right,
    .leaflet-control-attribution {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* Кастомная метка с эмодзи */
    .custom-marker {
      background-color: white;
      border: 3px solid currentColor;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.4);
      position: relative;
    }
    .custom-marker::after {
      content: "";
      position: absolute;
      bottom: -11px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 10px 8px 0;
      border-style: solid;
      border-top-color: currentColor;
      border-bottom-color: transparent;
      border-left-color: transparent;
      border-right-color: transparent;
    }

    /* Кнопки управления */
    .controls {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:active { background: #f1f5f9; }
    .btn-sync { background: #8b5cf6; color: white; border: none; }
    .btn-sync:active { background: #7c3aed; }

    /* Модальные окна */
    .modal {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-content {
      background: #ffffff;
      border-radius: 12px;
      width: 100%;
      max-width: 380px;
      padding: 20px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2);
    }
    .modal-content h3 { margin-bottom: 12px; font-size: 18px; color: #0f172a; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 4px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1;
      border-radius: 6px; font-size: 14px; outline: none;
    }

    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .btn-primary { background: #2563eb; color: #fff; border: none; }
    .btn-edit { background: #0284c7; color: #fff; border: none; }
    .btn-danger { background: #ef4444; color: #fff; border: none; }

    /* Балун */
    .popup-card { font-size: 13px; line-height: 1.4; min-width: 180px; }
    .popup-card h4 { font-size: 15px; margin-bottom: 4px; color: #0f172a; }
    .popup-rating { color: #f59e0b; font-weight: bold; margin-bottom: 6px; }
    .popup-comment { margin-bottom: 6px; color: #334155; }
    .popup-actions { margin-top: 10px; display: flex; gap: 6px; }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="controls">
    <button class="btn btn-sync" onclick="openSyncModal()">☁️ Синхронизация</button>
    <button class="btn" onclick="exportData()">💾 Файл (JSON)</button>
    <button class="btn" onclick="document.getElementById('importFile').click()">📂 Загрузить файл</button>
    <input type="file" id="importFile" style="display:none" onchange="importData(event)" accept=".json">
  </div>

  <!-- Модальное окно: Добавление/Редактирование -->
  <div class="modal" id="pointModal">
    <div class="modal-content">
      <h3 id="modalTitle">Новое место</h3>
      <div class="form-group">
        <label>Название / Описание места</label>
        <input type="text" id="placeTitle" placeholder="Например: Любимая кофейня">
      </div>
      <div class="form-group">
        <label>Категория</label>
        <select id="placeCategory">
          <option value="Заведение">☕ Заведение (кафе, бар, ресторан)</option>
          <option value="Достопримечательность">🏛️ Достопримечательность</option>
          <option value="Парк/Природа">🌲 Парк / Набережная</option>
          <option value="Улица/Район">🛣️ Улица / Маршрут</option>
          <option value="Другое">📌 Другое</option>
        </select>
      </div>
      <div class="form-group">
        <label>Дата посещения</label>
        <input type="date" id="placeDate">
      </div>
      <div class="form-group">
        <label>Оценка</label>
        <select id="placeRating">
          <option value="5">★★★★★ (5/5 — Отлично)</option>
          <option value="4">★★★★☆ (4/5 — Хорошо)</option>
          <option value="3">★★★☆☆ (3/5 — Нормально)</option>
          <option value="2">★★☆☆☆ (2/5 — Плохо)</option>
          <option value="1">★☆☆☆☆ (1/5 — Ужасно)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Впечатления / Заметка</label>
        <textarea id="placeComment" rows="3" placeholder="Что запомнилось, цены, когда посещал..."></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">Отмена</button>
        <button class="btn btn-primary" onclick="saveCurrentPoint()">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно: Синхронизация -->
  <div class="modal" id="syncModal">
    <div class="modal-content">
      <h3>Облачная синхронизация</h3>
      <p style="font-size: 13px; color: #475569; margin-bottom: 12px;">
        Создайте ID на одном устройстве (Выгрузить) и введите его на другом (Скачать), чтобы передать отметки.
      </p>
      <div class="form-group">
        <label>Ваш Sync ID:</label>
        <input type="text" id="syncIdInput" placeholder="Оставьте пустым для создания нового">
      </div>
      <div class="modal-actions" style="justify-content: space-between;">
        <button class="btn" onclick="closeSyncModal()">Закрыть</button>
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-edit" onclick="downloadFromCloud()" id="btnDownload">Скачать</button>
          <button class="btn btn-primary" onclick="uploadToCloud()" id="btnUpload">Выгрузить</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // --- 1. ИНИЦИАЛИЗАЦИЯ КАРТЫ БЕЗ СЛОВ ---
    const map = L.map('map', { attributionControl: false }).setView([56.8389, 60.6057], 13);
    
    // Красочная схема CartoDB Voyager Без Слов (nolabels)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png', {
      maxZoom: 19
    }).addTo(map);

    let places = JSON.parse(localStorage.getItem('ekb_places') || '[]');
    let markersMap = {};
    let pendingCoords = null;
    let editingId = null;

    // Функция иконок
    function getCustomIcon(category) {
      let color = '#475569'; let emoji = '📌';
      if (category === 'Заведение') { color = '#ea580c'; emoji = '☕'; }
      if (category === 'Достопримечательность') { color = '#7c3aed'; emoji = '🏛️'; }
      if (category === 'Парк/Природа') { color = '#10b981'; emoji = '🌲'; }
      if (category === 'Улица/Район') { color = '#2563eb'; emoji = '🛣️'; }

      const html = `<div class="custom-marker" style="color: ${color};">${emoji}</div>`;
      return L.divIcon({
        html: html, className: '', iconSize: [36, 46], iconAnchor: [18, 46], popupAnchor: [0, -42]
      });
    }

    places.forEach(renderMarker);

    // --- 2. ДОБАВЛЕНИЕ И РЕДАКТИРОВАНИЕ С ДАТОЙ ---
    map.on('click', (e) => {
      editingId = null;
      pendingCoords = { lat: e.latlng.lat, lng: e.latlng.lng };
      const today = new Date().toISOString().split('T')[0]; // Формат YYYY-MM-DD
      openModal('Новое место', '', 'Заведение', today, '5', '');
    });

    function openModal(titleText, title, cat, dateStr, rating, comment) {
      document.getElementById('modalTitle').innerText = titleText;
      document.getElementById('placeTitle').value = title;
      document.getElementById('placeCategory').value = cat;
      document.getElementById('placeDate').value = dateStr;
      document.getElementById('placeRating').value = rating;
      document.getElementById('placeComment').value = comment;
      document.getElementById('pointModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('pointModal').style.display = 'none'; }

    function saveCurrentPoint() {
      const title = document.getElementById('placeTitle').value.trim();
      if (!title) { alert('Пожалуйста, введите название!'); return; }

      const category = document.getElementById('placeCategory').value;
      const dateVal = document.getElementById('placeDate').value;
      const rating = document.getElementById('placeRating').value;
      const comment = document.getElementById('placeComment').value.trim();

      if (editingId) {
        const place = places.find(p => p.id === editingId);
        if (place) {
          place.title = title; place.category = category; place.date = dateVal;
          place.rating = rating; place.comment = comment;
          if (markersMap[editingId]) {
            markersMap[editingId].setPopupContent(buildPopupHtml(place));
            markersMap[editingId].setIcon(getCustomIcon(place.category));
          }
        }
      } else {
        const newPlace = {
          id: Date.now().toString(),
          title: title, category: category, date: dateVal, rating: rating, comment: comment,
          lat: pendingCoords.lat, lng: pendingCoords.lng
        };
        places.push(newPlace);
        renderMarker(newPlace);
      }
      saveToStorage();
      closeModal();
    }

    // Перевод даты из YYYY-MM-DD в ДД.ММ.ГГГГ для красоты
    function formatDate(dateStr) {
      if (!dateStr) return 'Не указана';
      const parts = dateStr.split('-');
      return parts.length === 3 ? `${parts[2]}.${parts[1]}.${parts[0]}` : dateStr;
    }

    function buildPopupHtml(place) {
      return `
        <div class="popup-card">
          <h4>${escapeHtml(place.title)}</h4>
          <div class="popup-rating">${'★'.repeat(place.rating)}${'☆'.repeat(5 - place.rating)} (${place.category})</div>
          <div class="popup-comment">${escapeHtml(place.comment || 'Без описания')}</div>
          <small style="color:#64748b;">Дата: ${formatDate(place.date)}</small>
          <div class="popup-actions">
            <button class="btn btn-edit" style="padding:4px 8px; font-size:11px;" onclick="startEditPlace('${place.id}')">Изменить</button>
            <button class="btn btn-danger" style="padding:4px 8px; font-size:11px;" onclick="deletePlace('${place.id}')">Удалить</button>
          </div>
        </div>
      `;
    }

    function renderMarker(place) {
      const marker = L.marker([place.lat, place.lng], { icon: getCustomIcon(place.category) }).addTo(map);
      marker.bindPopup(buildPopupHtml(place));
      markersMap[place.id] = marker;
    }

    window.startEditPlace = function(id) {
      const place = places.find(p => p.id === id);
      if (!place) return;
      if (markersMap[id]) markersMap[id].closePopup();
      editingId = id;
      openModal('Редактировать место', place.title, place.category, place.date, place.rating, place.comment);
    };

    window.deletePlace = function(id) {
      if (!confirm('Удалить эту метку?')) return;
      if (markersMap[id]) { map.removeLayer(markersMap[id]); delete markersMap[id]; }
      places = places.filter(p => p.id !== id);
      saveToStorage();
    };

    function saveToStorage() { localStorage.setItem('ekb_places', JSON.stringify(places)); }
    function escapeHtml(text) { return text.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m])); }

    // --- 3. ОБЛАЧНАЯ СИНХРОНИЗАЦИЯ ПО ID ---
    function openSyncModal() {
      document.getElementById('syncIdInput').value = localStorage.getItem('ekb_sync_id') || '';
      document.getElementById('syncModal').style.display = 'flex';
    }
    function closeSyncModal() { document.getElementById('syncModal').style.display = 'none'; }

    // Выгрузка в бесплатный JSON-бинарник npoint.io
    async function uploadToCloud() {
      let id = document.getElementById('syncIdInput').value.trim();
      const btn = document.getElementById('btnUpload');
      btn.innerText = 'Загрузка...';

      try {
        if (!id) {
          // Создаем новую ячейку
          const res = await fetch('https://api.npoint.io/', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(places)
          });
          const data = await res.json();
          id = data.id;
          document.getElementById('syncIdInput').value = id;
          localStorage.setItem('ekb_sync_id', id);
          alert('Создан ваш секретный Sync ID: ' + id + '\n\nВведите его на телефоне и нажмите "Скачать"');
        } else {
          // Обновляем существующую ячейку
          await fetch('https://api.npoint.io/' + id, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(places)
          });
          localStorage.setItem('ekb_sync_id', id);
          alert('Данные успешно сохранены в облаке!');
        }
      } catch (e) { alert('Ошибка: Проверьте интернет.'); }
      btn.innerText = 'Выгрузить';
    }

    // Скачивание из облака
    async function downloadFromCloud() {
      let id = document.getElementById('syncIdInput').value.trim();
      if (!id) { alert('Сначала введите Sync ID!'); return; }
      const btn = document.getElementById('btnDownload');
      btn.innerText = 'Скачивание...';

      try {
        const res = await fetch('https://api.npoint.io/' + id);
        if (!res.ok) throw new Error('Не найдено');
        const data = await res.json();
        
        if (Array.isArray(data)) {
          localStorage.setItem('ekb_sync_id', id);
          Object.values(markersMap).forEach(m => map.removeLayer(m));
          markersMap = {}; places = data; saveToStorage();
          places.forEach(renderMarker);
          alert('Успешно! Метки загружены.');
          closeSyncModal();
        } else { alert('Ошибка структуры данных в облаке.'); }
      } catch (e) { alert('ID не найден или произошла ошибка.'); }
      btn.innerText = 'Скачать';
    }

    // --- 4. РУЧНОЙ БЭКАП (Файлы) ---
    function exportData() {
      const blob = new Blob([JSON.stringify(places, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `ekb_map_${new Date().toISOString().slice(0,10)}.json`; a.click();
      URL.revokeObjectURL(url);
    }
    function importData(event) {
      const file = event.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            Object.values(markersMap).forEach(m => map.removeLayer(m));
            markersMap = {}; places = imported; saveToStorage();
            places.forEach(renderMarker); alert('Файл успешно загружен!');
          }
        } catch (err) { alert('Ошибка чтения файла.'); }
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
