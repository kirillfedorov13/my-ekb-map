<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Мой Екатеринбург — Карта мест</title>

  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; transition: background 0.2s, color 0.2s; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #f4f6f9; }

    #map { width: 100%; height: 100%; z-index: 1; }

    .leaflet-control-attribution { display: none !important; }
    .leaflet-routing-container { max-height: 30vh; overflow-y: auto; background: white; padding: 8px; border-radius: 8px; font-size: 12px; }

    /* ТЁМНАЯ ТЕМА */
    body.dark-mode { background: #0f172a; }
    body.dark-mode .leaflet-tile-pane { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
    body.dark-mode .modal-content { background: #1e293b; color: #f8fafc; }
    body.dark-mode .modal-content h3, body.dark-mode .form-group label { color: #f8fafc; }
    body.dark-mode .form-group input, body.dark-mode .form-group select, body.dark-mode .form-group textarea { background: #334155; color: #f8fafc; border: 1px solid #475569; }
    body.dark-mode .btn { background: #334155; color: #f8fafc; border-color: #475569; }
    body.dark-mode .leaflet-popup-content-wrapper, body.dark-mode .leaflet-popup-tip { background: #1e293b; color: #f8fafc; }
    body.dark-mode .popup-card h4 { color: #f8fafc; }
    body.dark-mode .popup-comment { color: #cbd5e1; }
    body.dark-mode .friend-item { background: #334155; border-color: #475569; }

    /* Метки */
    .custom-marker { background-color: white; border: 3px solid currentColor; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 18px; box-shadow: 0 3px 6px rgba(0,0,0,0.4); position: relative; }
    .custom-marker::after { content: ""; position: absolute; bottom: -11px; left: 50%; transform: translateX(-50%); border-width: 10px 8px 0; border-style: solid; border-top-color: currentColor; border-bottom-color: transparent; border-left-color: transparent; border-right-color: transparent; }
    .friend-marker { background-color: #10b981; color: white; border: 2px solid white; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 16px; box-shadow: 0 0 10px rgba(16,185,129,0.8); }

    .controls { position: absolute; top: 12px; right: 12px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; }
    .top-left-controls { position: absolute; top: 12px; left: 50px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; }

    .btn { background: #ffffff; border: 1px solid #cbd5e1; padding: 8px 14px; border-radius: 8px; font-size: 14px; font-weight: 600; color: #1e293b; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-primary { background: #2563eb !important; color: white !important; border: none !important; }
    .btn-sync { background: #8b5cf6 !important; color: white !important; border: none !important; }
    .btn-friends { background: #ec4899 !important; color: white !important; border: none !important; }
    .btn-icon { font-size: 18px; padding: 10px; border-radius: 50%; width: 44px; height: 44px; background: #ffffff; border: 1px solid #cbd5e1; }
    .btn-gps { background: #2563eb; color: white; border: none; }
    
    .modal { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.6); z-index: 2000; align-items: center; justify-content: center; padding: 16px; }
    .modal-content { background: #ffffff; border-radius: 12px; width: 100%; max-width: 380px; padding: 20px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; }
    .modal-content h3 { margin-bottom: 12px; font-size: 18px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    
    .popup-card { font-size: 13px; line-height: 1.4; min-width: 180px; }
    .popup-actions { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
    .friend-item { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 8px; border-radius: 6px; border: 1px solid #e2e8f0; margin-bottom: 6px; font-size: 14px; }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="top-left-controls">
    <button class="btn btn-icon btn-gps" id="gpsBtn" onclick="toggleTracking()" title="Моя геопозиция">🎯</button>
    <button class="btn btn-icon" id="themeBtn" onclick="toggleTheme()" title="Сменить тему">🌙</button>
  </div>

  <div class="controls">
    <button class="btn btn-friends" onclick="openFriendsModal()">👥 Друзья</button>
    <button class="btn btn-sync" onclick="openSyncModal()">☁️ Синхронизация</button>
    <button class="btn" onclick="exportData()">💾 Файл (JSON)</button>
    <button class="btn" style="background: #ef4444; color: white; border: none; display: none;" id="clearRouteBtn" onclick="clearRoute()">❌ Маршрут</button>
  </div>

  <div class="modal" id="pointModal">
    <div class="modal-content">
      <h3 id="modalTitle">Новое место</h3>
      <div class="form-group"><input type="text" id="placeTitle" placeholder="Название места"></div>
      <div class="form-group">
        <select id="placeCategory">
          <option value="Заведение">☕ Заведение</option>
          <option value="Достопримечательность">🏛️ Достопримечательность</option>
          <option value="Парк/Природа">🌲 Парк / Набережная</option>
          <option value="Улица/Район">🛣️ Улица / Маршрут</option>
        </select>
      </div>
      <div class="form-group"><input type="date" id="placeDate"></div>
      <div class="form-group">
        <select id="placeRating">
          <option value="5">★★★★★ (Отлично)</option><option value="4">★★★★☆ (Хорошо)</option><option value="3">★★★☆☆ (Нормально)</option><option value="2">★★☆☆☆ (Плохо)</option><option value="1">★☆☆☆☆ (Ужасно)</option>
        </select>
      </div>
      <div class="form-group"><textarea id="placeComment" rows="3" placeholder="Заметка..."></textarea></div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal('pointModal')">Отмена</button>
        <button class="btn btn-primary" onclick="saveCurrentPoint()">Сохранить</button>
      </div>
    </div>
  </div>

  <div class="modal" id="syncModal">
    <div class="modal-content">
      <h3>Облачная синхронизация</h3>
      <div class="form-group"><input type="text" id="syncIdInput" placeholder="Оставьте пустым для создания кода"></div>
      <div class="modal-actions" style="justify-content: space-between;">
        <button class="btn" onclick="closeModal('syncModal')">Закрыть</button>
        <div style="display: flex; gap: 8px;">
          <button class="btn" style="background:#0284c7; color:white; border:none;" onclick="downloadFromCloud()">Скачать</button>
          <button class="btn btn-primary" onclick="uploadToCloud()">Выгрузить</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="friendsModal">
    <div class="modal-content">
      <h3>Список друзей</h3>
      <div id="friendsList" style="margin-bottom: 12px; max-height: 150px; overflow-y: auto;"></div>
      <div style="border-top: 1px solid #cbd5e1; margin-top: 12px; padding-top: 12px;">
        <h4 style="margin-bottom: 8px; font-size: 14px;">Добавить друга</h4>
        <div class="form-group"><input type="text" id="friendName" placeholder="Имя друга (напр. Иван)"></div>
        <div class="form-group"><input type="text" id="friendId" placeholder="Его Sync ID"></div>
        <button class="btn btn-primary" style="width: 100%;" onclick="addFriend()">➕ Добавить</button>
      </div>
      <div class="modal-actions" style="justify-content: space-between; margin-top: 16px;">
        <button class="btn" onclick="closeModal('friendsModal')">Закрыть</button>
        <button class="btn" style="background:#10b981; color:white; border:none;" onclick="scanFriendsRadar()">📡 Найти друзей</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

  <script>
    const map = L.map('map', { attributionControl: false }).setView([56.8389, 60.6057], 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    let places = JSON.parse(localStorage.getItem('ekb_places') || '[]');
    let friends = JSON.parse(localStorage.getItem('ekb_friends') || '[]');
    
    let markersMap = {}; let friendMarkersMap = {};
    let pendingCoords = null, editingId = null;
    let userLocation = null, userMarker = null, tracking = false;
    let routingControl = null;

    let isDark = localStorage.getItem('ekb_theme') === 'dark';
    if (isDark) { document.body.classList.add('dark-mode'); document.getElementById('themeBtn').innerText = '☀️'; }

    function toggleTheme() {
      isDark = !isDark;
      if (isDark) { document.body.classList.add('dark-mode'); document.getElementById('themeBtn').innerText = '☀️'; }
      else { document.body.classList.remove('dark-mode'); document.getElementById('themeBtn').innerText = '🌙'; }
      localStorage.setItem('ekb_theme', isDark ? 'dark' : 'light');
    }

    function toggleTracking() {
      if (!tracking) {
        map.locate({ setView: true, maxZoom: 16, enableHighAccuracy: true, watch: true });
        tracking = true; document.getElementById('gpsBtn').style.background = '#10b981';
      } else {
        map.stopLocate(); tracking = false; document.getElementById('gpsBtn').style.background = '#2563eb';
      }
    }

    map.on('locationfound', function(e) {
      userLocation = { lat: e.latlng.lat, lng: e.latlng.lng };
      if (!userMarker) { userMarker = L.circleMarker(e.latlng, { radius: 8, color: 'white', weight: 2, fillColor: '#3b82f6', fillOpacity: 1, zIndexOffset: 1000 }).addTo(map); } 
      else { userMarker.setLatLng(e.latlng); }
    });

    function getCustomIcon(category) {
      let color = '#475569'; let emoji = '📌';
      if (category === 'Заведение') { color = '#ea580c'; emoji = '☕'; }
      if (category === 'Достопримечательность') { color = '#7c3aed'; emoji = '🏛️'; }
      if (category === 'Парк/Природа') { color = '#10b981'; emoji = '🌲'; }
      if (category === 'Улица/Район') { color = '#2563eb'; emoji = '🛣️'; }
      return L.divIcon({ html: `<div class="custom-marker" style="color: ${color};">${emoji}</div>`, className: '', iconSize: [36, 46], iconAnchor: [18, 46], popupAnchor: [0, -42] });
    }

    places.forEach(renderMarker);

    map.on('click', (e) => {
      editingId = null; pendingCoords = { lat: e.latlng.lat, lng: e.latlng.lng };
      document.getElementById('modalTitle').innerText = 'Новое место';
      document.getElementById('placeTitle').value = '';
      document.getElementById('placeDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('placeComment').value = '';
      document.getElementById('pointModal').style.display = 'flex';
    });

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function saveCurrentPoint() {
      const t = document.getElementById('placeTitle').value.trim(); if(!t){ alert('Введите название!'); return;}
      const pData = { title: t, category: document.getElementById('placeCategory').value, date: document.getElementById('placeDate').value, rating: document.getElementById('placeRating').value, comment: document.getElementById('placeComment').value.trim() };
      
      if (editingId) {
        const p = places.find(x => x.id === editingId);
        if (p) { Object.assign(p, pData); if(markersMap[editingId]){ markersMap[editingId].setPopupContent(buildPopupHtml(p)); markersMap[editingId].setIcon(getCustomIcon(p.category)); } }
      } else {
        const newPlace = { id: Date.now().toString(), lat: pendingCoords.lat, lng: pendingCoords.lng, ...pData };
        places.push(newPlace); renderMarker(newPlace);
      }
      localStorage.setItem('ekb_places', JSON.stringify(places)); closeModal('pointModal');
    }

    function buildPopupHtml(p) {
      return `<div class="popup-card"><h4>${p.title}</h4>
          <div style="color:#f59e0b;font-weight:bold;">${'★'.repeat(p.rating)}${'☆'.repeat(5-p.rating)} (${p.category})</div>
          <div class="popup-comment" style="margin:6px 0;">${p.comment}</div>
          <div class="popup-actions">
            <button class="btn" style="background:#10b981;color:white;border:none;padding:4px 8px;font-size:11px;" onclick="buildRoute(${p.lat}, ${p.lng})">📍 Маршрут</button>
            <button class="btn" style="background:#0284c7;color:white;border:none;padding:4px 8px;font-size:11px;" onclick="startEditPlace('${p.id}')">Изменить</button>
            <button class="btn" style="background:#ef4444;color:white;border:none;padding:4px 8px;font-size:11px;" onclick="deletePlace('${p.id}')">Удалить</button>
          </div></div>`;
    }

    function renderMarker(p) {
      const marker = L.marker([p.lat, p.lng], { icon: getCustomIcon(p.category) }).addTo(map);
      marker.bindPopup(buildPopupHtml(p)); markersMap[p.id] = marker;
    }

    window.startEditPlace = function(id) {
      const p = places.find(x => x.id === id); if(!p) return;
      if(markersMap[id]) markersMap[id].closePopup(); editingId = id;
      document.getElementById('modalTitle').innerText = 'Редактировать'; document.getElementById('placeTitle').value = p.title;
      document.getElementById('placeCategory').value = p.category; document.getElementById('placeDate').value = p.date;
      document.getElementById('placeRating').value = p.rating; document.getElementById('placeComment').value = p.comment;
      document.getElementById('pointModal').style.display = 'flex';
    };

    window.deletePlace = function(id) {
      if(!confirm('Удалить метку?')) return;
      if(markersMap[id]){ map.removeLayer(markersMap[id]); delete markersMap[id]; }
      places = places.filter(x => x.id !== id); localStorage.setItem('ekb_places', JSON.stringify(places));
    };

    window.buildRoute = function(lat, lng) {
      if (!userLocation) { alert("Включите геопозицию (кнопка 🎯 слева)."); return; }
      if (routingControl) { map.removeControl(routingControl); }
      routingControl = L.Routing.control({ waypoints: [ L.latLng(userLocation.lat, userLocation.lng), L.latLng(lat, lng) ], show: false }).addTo(map);
      document.getElementById('clearRouteBtn').style.display = 'flex'; map.closePopup();
    };
    function clearRoute() { if (routingControl) { map.removeControl(routingControl); routingControl = null; } document.getElementById('clearRouteBtn').style.display = 'none'; }

    function openSyncModal() { document.getElementById('syncIdInput').value = localStorage.getItem('ekb_sync_id') || ''; document.getElementById('syncModal').style.display = 'flex'; }
    
    // --- НОВЫЙ МЕХАНИЗМ ОБЛАКА (JSONBlob) ---
    async function uploadToCloud() {
      let id = document.getElementById('syncIdInput').value.trim();
      let payload = [...places];
      
      if (userLocation) {
        payload.push({ id: 'user_live_location', isUserLocation: true, lat: userLocation.lat, lng: userLocation.lng, timestamp: new Date().toLocaleString() });
      }

      try {
        if (!id) {
          const res = await fetch('https://jsonblob.com/api/jsonBlob', { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, 
            body: JSON.stringify(payload) 
          });
          if (!res.ok) throw new Error("Сервер отклонил создание");
          
          // Получаем ID из заголовка ответа Location
          const location = res.headers.get('Location');
          id = location.split('/').pop(); 
          
          localStorage.setItem('ekb_sync_id', id); 
          document.getElementById('syncIdInput').value = id;
          alert('Создан ваш Sync ID: ' + id + '\n\nСкопируйте его и отправьте друзьям.');
        } else {
          const res = await fetch('https://jsonblob.com/api/jsonBlob/' + id, { 
            method: 'PUT', 
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, 
            body: JSON.stringify(payload) 
          });
          if (!res.ok) throw new Error("Код не найден");
          localStorage.setItem('ekb_sync_id', id); 
          alert('Данные и ваша позиция успешно выгружены!');
        }
      } catch (e) { alert('Ошибка синхронизации: ' + e.message); }
    }
    
    async function downloadFromCloud() {
      let id = document.getElementById('syncIdInput').value.trim(); if (!id) return;
      try {
        const res = await fetch('https://jsonblob.com/api/jsonBlob/' + id); 
        if (!res.ok) throw new Error("Неверный код");
        const data = await res.json();
        
        if (Array.isArray(data)) {
          const filteredData = data.filter(p => !p.isUserLocation);
          localStorage.setItem('ekb_sync_id', id); Object.values(markersMap).forEach(m => map.removeLayer(m));
          markersMap = {}; places = filteredData; localStorage.setItem('ekb_places', JSON.stringify(places));
          places.forEach(renderMarker); alert('Загружено!'); closeModal('syncModal');
        } else { alert('Файл пуст'); }
      } catch (e) { alert('Ошибка: ' + e.message); }
    }

    function openFriendsModal() { renderFriendsList(); document.getElementById('friendsModal').style.display = 'flex'; }
    
    function renderFriendsList() {
      const list = document.getElementById('friendsList'); list.innerHTML = '';
      if(friends.length === 0) { list.innerHTML = '<div style="color:#64748b;font-size:13px;">Список пуст.</div>'; return; }
      friends.forEach((f, idx) => {
        list.innerHTML += `<div class="friend-item">
          <b>${f.name}</b> <span style="color:#94a3b8;font-size:12px;">(${f.id})</span>
          <button class="btn" style="padding:2px 6px;font-size:12px;background:#ef4444;color:white;border:none;" onclick="removeFriend(${idx})">Удалить</button>
        </div>`;
      });
    }

    function addFriend() {
      const name = document.getElementById('friendName').value.trim();
      const id = document.getElementById('friendId').value.trim();
      if(!name || !id) { alert('Заполните оба поля!'); return; }
      friends.push({name, id}); localStorage.setItem('ekb_friends', JSON.stringify(friends));
      document.getElementById('friendName').value = ''; document.getElementById('friendId').value = ''; renderFriendsList();
    }

    window.removeFriend = function(idx) {
      if(friendMarkersMap[friends[idx].id]) { map.removeLayer(friendMarkersMap[friends[idx].id]); delete friendMarkersMap[friends[idx].id]; }
      friends.splice(idx, 1); localStorage.setItem('ekb_friends', JSON.stringify(friends)); renderFriendsList();
    };

    async function scanFriendsRadar() {
      closeModal('friendsModal');
      if(friends.length === 0) { alert('Сначала добавьте друзей!'); return; }
      let found = 0;
      
      for(let f of friends) {
        try {
          const res = await fetch('https://jsonblob.com/api/jsonBlob/' + f.id);
          const data = await res.json();
          
          if(Array.isArray(data)) {
            const friendLoc = data.find(p => p.isUserLocation === true);
            if(friendLoc) {
              found++;
              if(friendMarkersMap[f.id]) map.removeLayer(friendMarkersMap[f.id]);
              const icon = L.divIcon({ html: `<div class="friend-marker">🧑</div>`, className: '', iconSize: [32,32], iconAnchor: [16,16] });
              const fm = L.marker([friendLoc.lat, friendLoc.lng], {icon, zIndexOffset: 2000}).addTo(map);
              fm.bindPopup(`<b>${f.name}</b><br><small>Был в сети: ${friendLoc.timestamp}</small>`);
              friendMarkersMap[f.id] = fm;
            }
          }
        } catch(e) {}
      }
      alert(`Радар обновлен! Найдено друзей в сети: ${found}`);
    }

    function exportData() {
      const url = URL.createObjectURL(new Blob([JSON.stringify(places, null, 2)], { type: 'application/json' }));
      const a = document.createElement('a'); a.href = url; a.download = `ekb_map.json`; a.click(); URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
