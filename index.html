<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Мой Екатеринбург — Карта мест</title>

  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Leaflet Routing Machine CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #f4f6f9; }

    #map { width: 100%; height: 100%; z-index: 1; }

    .leaflet-control-attribution { display: none !important; }

    /* Панель маршрута - скрываем лишние детали для мобилок */
    .leaflet-routing-container { max-height: 30vh; overflow-y: auto; background: white; padding: 8px; border-radius: 8px; font-size: 12px; }

    .custom-marker {
      background-color: white; border: 3px solid currentColor; border-radius: 50%;
      width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
      font-size: 18px; box-shadow: 0 3px 6px rgba(0,0,0,0.4); position: relative;
    }
    .custom-marker::after {
      content: ""; position: absolute; bottom: -11px; left: 50%; transform: translateX(-50%);
      border-width: 10px 8px 0; border-style: solid; border-top-color: currentColor;
      border-bottom-color: transparent; border-left-color: transparent; border-right-color: transparent;
    }

    .controls { position: absolute; top: 12px; right: 12px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; }
    
    /* Кнопка геолокации слева */
    .gps-control { position: absolute; top: 12px; left: 50px; z-index: 1000; }

    .btn {
      background: #ffffff; border: 1px solid #cbd5e1; padding: 8px 14px; border-radius: 8px;
      font-size: 14px; font-weight: 600; color: #1e293b; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn:active { background: #f1f5f9; }
    .btn-sync { background: #8b5cf6; color: white; border: none; }
    .btn-gps { background: #2563eb; color: white; border: none; font-size: 18px; padding: 10px; border-radius: 50%; width: 44px; height: 44px; }
    .btn-route { background: #10b981; color: white; border: none; }
    .btn-clear-route { background: #ef4444; color: white; border: none; display: none; margin-top: 8px; }

    .modal { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.45); z-index: 2000; align-items: center; justify-content: center; padding: 16px; }
    .modal-content { background: #ffffff; border-radius: 12px; width: 100%; max-width: 380px; padding: 20px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); }
    .modal-content h3 { margin-bottom: 12px; font-size: 18px; color: #0f172a; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    
    .popup-card { font-size: 13px; line-height: 1.4; min-width: 180px; }
    .popup-actions { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Кнопка геолокации -->
  <div class="gps-control">
    <button class="btn btn-gps" onclick="locateUser()" title="Где я?">🎯</button>
  </div>

  <!-- Управление -->
  <div class="controls">
    <button class="btn btn-sync" onclick="openSyncModal()">☁️ Синхронизация</button>
    <button class="btn" onclick="exportData()">💾 Файл (JSON)</button>
    <button class="btn btn-clear-route" id="clearRouteBtn" onclick="clearRoute()">❌ Убрать маршрут</button>
    <input type="file" id="importFile" style="display:none" onchange="importData(event)" accept=".json">
  </div>

  <!-- Модальное окно места -->
  <div class="modal" id="pointModal">
    <div class="modal-content">
      <h3 id="modalTitle">Новое место</h3>
      <div class="form-group"><input type="text" id="placeTitle" placeholder="Название места"></div>
      <div class="form-group">
        <select id="placeCategory">
          <option value="Заведение">☕ Заведение</option>
          <option value="Достопримечательность">🏛️ Достопримечательность</option>
          <option value="Парк/Природа">🌲 Парк / Набережная</option>
          <option value="Улица/Район">🛣️ Улица / Маршрут</option>
        </select>
      </div>
      <div class="form-group"><input type="date" id="placeDate"></div>
      <div class="form-group">
        <select id="placeRating">
          <option value="5">★★★★★ (Отлично)</option>
          <option value="4">★★★★☆ (Хорошо)</option>
          <option value="3">★★★☆☆ (Нормально)</option>
          <option value="2">★★☆☆☆ (Плохо)</option>
          <option value="1">★☆☆☆☆ (Ужасно)</option>
        </select>
      </div>
      <div class="form-group"><textarea id="placeComment" rows="3" placeholder="Заметка..."></textarea></div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">Отмена</button>
        <button class="btn" style="background:#2563eb; color:white; border:none;" onclick="saveCurrentPoint()">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно синхронизации -->
  <div class="modal" id="syncModal">
    <div class="modal-content">
      <h3>Облачная синхронизация</h3>
      <div class="form-group"><input type="text" id="syncIdInput" placeholder="Ваш Sync ID"></div>
      <div class="modal-actions" style="justify-content: space-between;">
        <button class="btn" onclick="closeSyncModal()">Закрыть</button>
        <div style="display: flex; gap: 8px;">
          <button class="btn" style="background:#0284c7; color:white; border:none;" onclick="downloadFromCloud()">Скачать</button>
          <button class="btn" style="background:#2563eb; color:white; border:none;" onclick="uploadToCloud()">Выгрузить</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Скрипты Leaflet и плагина маршрутов -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

  <script>
    // 1. ИНИЦИАЛИЗАЦИЯ (Используем стандартный OpenStreetMap - есть все дома и улицы)
    const map = L.map('map', { attributionControl: false }).setView([56.8389, 60.6057], 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    let places = JSON.parse(localStorage.getItem('ekb_places') || '[]');
    let markersMap = {};
    let pendingCoords = null, editingId = null;
    let userLocation = null;
    let userMarker = null;
    let routingControl = null;

    function getCustomIcon(category) {
      let color = '#475569'; let emoji = '📌';
      if (category === 'Заведение') { color = '#ea580c'; emoji = '☕'; }
      if (category === 'Достопримечательность') { color = '#7c3aed'; emoji = '🏛️'; }
      if (category === 'Парк/Природа') { color = '#10b981'; emoji = '🌲'; }
      if (category === 'Улица/Район') { color = '#2563eb'; emoji = '🛣️'; }
      return L.divIcon({ html: `<div class="custom-marker" style="color: ${color};">${emoji}</div>`, className: '', iconSize: [36, 46], iconAnchor: [18, 46], popupAnchor: [0, -42] });
    }

    places.forEach(renderMarker);

    // 2. ГЕОЛОКАЦИЯ
    function locateUser() {
      map.locate({ setView: true, maxZoom: 16, enableHighAccuracy: true });
    }

    map.on('locationfound', function(e) {
      userLocation = e.latlng;
      if (!userMarker) {
        userMarker = L.circleMarker(e.latlng, { radius: 8, color: 'white', weight: 2, fillColor: '#3b82f6', fillOpacity: 1 }).addTo(map);
      } else {
        userMarker.setLatLng(e.latlng);
      }
    });

    map.on('locationerror', function(e) {
      alert("Не удалось определить местоположение. Включите GPS на устройстве.");
    });

    // 3. ДОБАВЛЕНИЕ МЕТКИ
    map.on('click', (e) => {
      editingId = null;
      pendingCoords = { lat: e.latlng.lat, lng: e.latlng.lng };
      openModal('Новое место', '', 'Заведение', new Date().toISOString().split('T')[0], '5', '');
    });

    function openModal(tText, t, c, d, r, com) {
      document.getElementById('modalTitle').innerText = tText; document.getElementById('placeTitle').value = t;
      document.getElementById('placeCategory').value = c; document.getElementById('placeDate').value = d;
      document.getElementById('placeRating').value = r; document.getElementById('placeComment').value = com;
      document.getElementById('pointModal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('pointModal').style.display = 'none'; }

    function saveCurrentPoint() {
      const t = document.getElementById('placeTitle').value.trim(); if(!t){ alert('Введите название!'); return;}
      const pData = {
        title: t, category: document.getElementById('placeCategory').value, date: document.getElementById('placeDate').value,
        rating: document.getElementById('placeRating').value, comment: document.getElementById('placeComment').value.trim()
      };
      
      if (editingId) {
        const p = places.find(x => x.id === editingId);
        if (p) { Object.assign(p, pData); if(markersMap[editingId]){ markersMap[editingId].setPopupContent(buildPopupHtml(p)); markersMap[editingId].setIcon(getCustomIcon(p.category)); } }
      } else {
        const newPlace = { id: Date.now().toString(), lat: pendingCoords.lat, lng: pendingCoords.lng, ...pData };
        places.push(newPlace); renderMarker(newPlace);
      }
      localStorage.setItem('ekb_places', JSON.stringify(places)); closeModal();
    }

    // 4. МАРШРУТИЗАЦИЯ
    window.buildRoute = function(lat, lng) {
      if (!userLocation) {
        alert("Сначала нажмите кнопку прицела (🎯) слева вверху, чтобы определить вашу геопозицию.");
        return;
      }
      
      if (routingControl) { map.removeControl(routingControl); }
      
      routingControl = L.Routing.control({
        waypoints: [ L.latLng(userLocation.lat, userLocation.lng), L.latLng(lat, lng) ],
        language: 'ru',
        routeWhileDragging: false,
        addWaypoints: false,
        fitSelectedRoutes: true,
        show: false // Скрываем текстовую панель шагов маршрута для компактности
      }).addTo(map);

      document.getElementById('clearRouteBtn').style.display = 'flex';
      map.closePopup();
    };

    function clearRoute() {
      if (routingControl) { map.removeControl(routingControl); routingControl = null; }
      document.getElementById('clearRouteBtn').style.display = 'none';
    }

    function buildPopupHtml(p) {
      return `
        <div class="popup-card">
          <h4>${p.title}</h4>
          <div style="color:#f59e0b;font-weight:bold;">${'★'.repeat(p.rating)}${'☆'.repeat(5-p.rating)} (${p.category})</div>
          <div style="margin:6px 0;">${p.comment}</div>
          <div class="popup-actions">
            <button class="btn btn-route" style="padding:4px 8px;font-size:11px;" onclick="buildRoute(${p.lat}, ${p.lng})">📍 Маршрут</button>
            <button class="btn" style="background:#0284c7;color:white;border:none;padding:4px 8px;font-size:11px;" onclick="startEditPlace('${p.id}')">Изменить</button>
            <button class="btn" style="background:#ef4444;color:white;border:none;padding:4px 8px;font-size:11px;" onclick="deletePlace('${p.id}')">Удалить</button>
          </div>
        </div>`;
    }

    function renderMarker(p) {
      const marker = L.marker([p.lat, p.lng], { icon: getCustomIcon(p.category) }).addTo(map);
      marker.bindPopup(buildPopupHtml(p)); markersMap[p.id] = marker;
    }

    window.startEditPlace = function(id) {
      const p = places.find(x => x.id === id); if(!p) return;
      if(markersMap[id]) markersMap[id].closePopup(); editingId = id; openModal('Редактировать', p.title, p.category, p.date, p.rating, p.comment);
    };

    window.deletePlace = function(id) {
      if(!confirm('Удалить метку?')) return;
      if(markersMap[id]){ map.removeLayer(markersMap[id]); delete markersMap[id]; }
      places = places.filter(x => x.id !== id); localStorage.setItem('ekb_places', JSON.stringify(places));
    };

    // 5. СИНХРОНИЗАЦИЯ
    function openSyncModal() { document.getElementById('syncIdInput').value = localStorage.getItem('ekb_sync_id') || ''; document.getElementById('syncModal').style.display = 'flex'; }
    function closeSyncModal() { document.getElementById('syncModal').style.display = 'none'; }
    
    async function uploadToCloud() {
      let id = document.getElementById('syncIdInput').value.trim();
      try {
        if (!id) {
          const res = await fetch('https://api.npoint.io/', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(places) });
          id = (await res.json()).id; localStorage.setItem('ekb_sync_id', id); document.getElementById('syncIdInput').value = id;
          alert('Создан Sync ID: ' + id);
        } else {
          await fetch('https://api.npoint.io/' + id, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(places) });
          localStorage.setItem('ekb_sync_id', id); alert('Успешно выгружено!');
        }
      } catch (e) { alert('Ошибка сети.'); }
    }
    
    async function downloadFromCloud() {
      let id = document.getElementById('syncIdInput').value.trim(); if (!id) return;
      try {
        const res = await fetch('https://api.npoint.io/' + id); if (!res.ok) throw new Error();
        const data = await res.json();
        if (Array.isArray(data)) {
          localStorage.setItem('ekb_sync_id', id); Object.values(markersMap).forEach(m => map.removeLayer(m));
          markersMap = {}; places = data; localStorage.setItem('ekb_places', JSON.stringify(places));
          places.forEach(renderMarker); alert('Загружено!'); closeSyncModal();
        }
      } catch (e) { alert('Ошибка или ID не найден.'); }
    }
    
    function exportData() {
      const url = URL.createObjectURL(new Blob([JSON.stringify(places, null, 2)], { type: 'application/json' }));
      const a = document.createElement('a'); a.href = url; a.download = `ekb_map.json`; a.click(); URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
