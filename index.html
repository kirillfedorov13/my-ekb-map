<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Мой Екатеринбург — Карта мест</title>

  <!-- Манифест PWA для запуска как отдельное приложение -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- Стили Leaflet (библиотека интерактивных карт) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* Сброс базовых стилей под fullscreen приложение */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #f4f6f9; }

    #map { width: 100%; height: 100%; z-index: 1; }

    /* Плавающая панель управления */
    .controls {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      cursor: pointer;
    }
    .btn:active { background: #f1f5f9; }

    /* Всплывающее окно добавления/редактирования */
    .modal {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-content {
      background: #ffffff;
      border-radius: 12px;
      width: 100%;
      max-width: 380px;
      padding: 20px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2);
    }

    .modal-content h3 { margin-bottom: 12px; font-size: 18px; color: #0f172a; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 4px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .btn-primary { background: #2563eb; color: #fff; border: none; }
    .btn-danger { background: #ef4444; color: #fff; border: none; }

    /* Оформление балуна метки */
    .popup-card { font-size: 13px; line-height: 1.4; }
    .popup-card h4 { font-size: 15px; margin-bottom: 4px; color: #0f172a; }
    .popup-rating { color: #f59e0b; font-weight: bold; margin-bottom: 4px; }
    .popup-actions { margin-top: 8px; display: flex; gap: 6px; }
  </style>
</head>
<body>

  <!-- Контейнер карты -->
  <div id="map"></div>

  <!-- Верхняя панель: резервная копия данных -->
  <div class="controls">
    <button class="btn" onclick="exportData()"> Экспорт (JSON)</button>
    <button class="btn" onclick="document.getElementById('importFile').click()"> Импорт</button>
    <input type="file" id="importFile" style="display:none" onchange="importData(event)" accept=".json">
  </div>

  <!-- Модальное окно для создания/редактирования точки -->
  <div class="modal" id="pointModal">
    <div class="modal-content">
      <h3 id="modalTitle">Новое место</h3>
      <div class="form-group">
        <label>Название / Адрес</label>
        <input type="text" id="placeTitle" placeholder="Например: Кафе «Энгельс»">
      </div>
      <div class="form-group">
        <label>Категория</label>
        <select id="placeCategory">
          <option value="Заведение">☕ Заведение (кафе, бар, ресторан)</option>
          <option value="Достопримечательность"> Достопримечательность / Памятник</option>
          <option value="Парк/Природа"> Парк / Набережная</option>
          <option value="Улица/Район"> Улица / Маршрут</option>
          <option value="Другое"> Другое</option>
        </select>
      </div>
      <div class="form-group">
        <label>Оценка</label>
        <select id="placeRating">
          <option value="5">★★★★★ (5/5 — Отлично)</option>
          <option value="4">★★★★☆ (4/5 — Хорошо)</option>
          <option value="3">★★★☆☆ (3/5 — Нормально)</option>
          <option value="2">★★☆☆☆ (2/5 — Плохо)</option>
          <option value="1">★☆☆☆☆ (1/5 — Ужасно)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Впечатления / Заметка</label>
        <textarea id="placeComment" rows="3" placeholder="Что понравилось, когда был, цены..."></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">Отмена</button>
        <button class="btn btn-primary" onclick="saveCurrentPoint()">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Библиотека Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // -------------------------------------------------------------------------
    // 1. ИНИЦИАЛИЗАЦИЯ КАРТЫ ЕКАТЕРИНБУРГА
    // Координаты центра: Площадь 1905 года (56.8389° N, 60.6057° E), зум 13
    // -------------------------------------------------------------------------
    const map = L.map('map').setView([56.8389, 60.6057], 13);

    // Слой карты: CartoDB Voyager.
    // Это детальная векторная схема без лишнего спутникового шума (как 2ГИС/Яндекс Схема).
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      maxZoom: 19
    }).addTo(map);

    // -------------------------------------------------------------------------
    // 2. ХРАНЕНИЕ ДАННЫХ И ПЕРЕМЕННЫЕ
    // -------------------------------------------------------------------------
    let places = JSON.parse(localStorage.getItem('ekb_places') || '[]');
    let markersMap = {}; // Хранилище объектов маркеров на карте по id
    let pendingCoords = null; // Координаты клика перед сохранением

    // Загрузка сохраненных меток при старте
    places.forEach(renderMarker);

    // -------------------------------------------------------------------------
    // 3. ДОБАВЛЕНИЕ НОВОЙ ТОЧКИ ПО КЛИКУ НА КАРТУ
    // -------------------------------------------------------------------------
    map.on('click', (e) => {
      pendingCoords = { lat: e.latlng.lat, lng: e.latlng.lng };
      openModal();
    });

    function openModal() {
      document.getElementById('modalTitle').innerText = 'Новое место';
      document.getElementById('placeTitle').value = '';
      document.getElementById('placeComment').value = '';
      document.getElementById('placeRating').value = '5';
      document.getElementById('placeCategory').value = 'Заведение';
      document.getElementById('pointModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('pointModal').style.display = 'none';
      pendingCoords = null;
    }

    function saveCurrentPoint() {
      const title = document.getElementById('placeTitle').value.trim();
      if (!title) {
        alert('Пожалуйста, введите название места!');
        return;
      }

      const newPlace = {
        id: Date.now().toString(),
        title: title,
        category: document.getElementById('placeCategory').value,
        rating: document.getElementById('placeRating').value,
        comment: document.getElementById('placeComment').value.trim(),
        lat: pendingCoords.lat,
        lng: pendingCoords.lng,
        date: new Date().toLocaleDateString('ru-RU')
      };

      places.push(newPlace);
      saveToStorage();
      renderMarker(newPlace);
      closeModal();
    }

    // -------------------------------------------------------------------------
    // 4. ОТРИСОВКА МЕТКИ НА КАРТЕ
    // -------------------------------------------------------------------------
    function renderMarker(place) {
      const marker = L.marker([place.lat, place.lng]).addTo(map);

      // Формирование содержимого балуна при клике на метку
      const popupHtml = `
        <div class="popup-card">
          <h4>${escapeHtml(place.title)}</h4>
          <div class="popup-rating">${'★'.repeat(place.rating)}${'☆'.repeat(5 - place.rating)} (${place.category})</div>
          <p>${escapeHtml(place.comment || 'Без описания')}</p>
          <small style="color:#64748b;">Дата добавления: ${place.date}</small>
          <div class="popup-actions">
            <button class="btn btn-danger" style="padding:4px 8px; font-size:11px;" onclick="deletePlace('${place.id}')">Удалить</button>
          </div>
        </div>
      `;

      marker.bindPopup(popupHtml);
      markersMap[place.id] = marker;
    }

    // -------------------------------------------------------------------------
    // 5. УДАЛЕНИЕ МЕСТА
    // -------------------------------------------------------------------------
    window.deletePlace = function(id) {
      if (!confirm('Удалить эту отметку?')) return;

      // Удаление с карты
      if (markersMap[id]) {
        map.removeLayer(markersMap[id]);
        delete markersMap[id];
      }

      // Удаление из базы данных
      places = places.filter(p => p.id !== id);
      saveToStorage();
    };

    function saveToStorage() {
      localStorage.setItem('ekb_places', JSON.stringify(places));
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[m]));
    }

    // -------------------------------------------------------------------------
    // 6. СИНХРОНИЗАЦИЯ (ЭКСПОРТ / ИМПОРТ JSON ДЛЯ ПЕРЕНОСА МЕЖДУ ПК И ТЕЛЕФОНОМ)
    // -------------------------------------------------------------------------
    function exportData() {
      const blob = new Blob([JSON.stringify(places, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ekb_places_backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            // Очищаем текущие маркеры
            Object.values(markersMap).forEach(m => map.removeLayer(m));
            markersMap = {};

            // Перезаписываем базу
            places = imported;
            saveToStorage();
            places.forEach(renderMarker);
            alert('Данные успешно импортированы!');
          }
        } catch (err) {
          alert('Ошибка чтения файла: неверный формат JSON.');
        }
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
